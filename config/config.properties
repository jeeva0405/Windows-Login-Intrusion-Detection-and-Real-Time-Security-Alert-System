# =======================================================
# Windows Login Sentinel Configuration
# =======================================================

# SMTP Server Settings (Default: Gmail SMTP)
smtp.host=smtp.gmail.com
smtp.port=587
smtp.auth=true
smtp.starttls.enable=true
smtp.ssl.protocols=TLSv1.2 TLSv1.3
smtp.connectiontimeout=10000
smtp.timeout=10000

# Email Account & Alert Settings
# Note: Sensitive credentials (EMAIL_USERNAME, EMAIL_APP_PASSWORD, ALERT_RECIPIENT_EMAIL)
# should ideally be set as Environment Variables.
# Fallback values can be supplied below if environment variables are not present.
email.username=YOUR_GMAIL_ADDRESS@gmail.com
email.password=YOUR_16_CHAR_APP_PASSWORD
email.recipient=YOUR_ALERT_RECIPIENT@gmail.com

# Monitoring Configuration
monitor.interval.seconds=5
monitor.event.id=4625

# Service State & Duplicate Prevention File
state.file.path=config/state.properties

# Webcam Capture Settings
webcam.enabled=true
webcam.width=640
webcam.height=480
webcam.timeout.ms=3000
